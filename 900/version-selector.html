:root{--bg:#050a12;--blue:#00aaff;--gold:#ffd21a;--ok:#19f08a;--line:#183552;--muted:#8da4bc;--text:#f5f8ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050a12;color:var(--text);font-family:Arial,Helvetica,sans-serif}body{min-height:100vh;background:linear-gradient(90deg,rgba(2,8,16,.9),rgba(2,8,16,.48)),url("../assets/showcase.webp") center/cover fixed no-repeat}.wrap{width:min(1100px,94vw);min-height:100vh;margin:auto;display:flex;flex-direction:column;justify-content:center;padding:28px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:34px;font-weight:900;font-style:italic}.brand span{color:var(--blue)}.fw{color:var(--muted);font-size:13px;text-align:right}.card{background:rgba(4,12,22,.84);border:1px solid var(--line);border-radius:18px;padding:38px;backdrop-filter:blur(8px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}.eyebrow{color:var(--blue);font-size:12px;letter-spacing:.25em;font-weight:bold}.hen{font-size:72px;font-weight:900;font-style:italic;margin-top:16px;background:linear-gradient(90deg,#ffd500,#fff,#ffd500);-webkit-background-clip:text;color:transparent}.version{font-size:28px}.desc{color:var(--muted);margin:10px auto 25px;max-width:600px}.ready{display:inline-block;border:1px solid #15754d;background:rgba(25,240,138,.08);color:var(--ok);padding:9px 18px;border-radius:20px;font-weight:bold;font-size:13px}.choice{margin:24px auto 0;max-width:600px;border:1px solid #21435f;border-radius:13px;padding:18px;text-align:left;background:rgba(1,8,16,.6)}.row{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid #173049}.row:last-child{border:0}.muted{color:var(--muted)}.go{display:block;margin:24px auto 0;max-width:430px;padding:17px;border:2px solid var(--blue);border-radius:12px;background:rgba(0,126,220,.18);color:#fff;font-size:19px;font-weight:bold;cursor:pointer}.go:hover,.go:focus{background:rgba(0,170,255,.3);outline:0}.foot{text-align:center;color:#6f879e;font-size:12px;margin-top:15px}@media(max-width:700px){.card{padding:26px 18px}.hen{font-size:52px}.head{align-items:flex-start}}
</style><link rel="stylesheet" href="../assets/amine-theme.css"><link rel="stylesheet" href="../assets/amine-compact.css"><link rel="stylesheet" href="../assets/amine-zombie.css">
</head><body><div class="wrap"><header class="head"><div class="brand">AMINE <span>PS4</span></div><div class="fw">PS4 9.00–9.60<br><b>OFFLINE HOST</b></div></header><main class="card"><div class="eyebrow">GOLDHEN LAUNCHER</div><div class="hen">GoldHEN</div><div class="version">v2.4b18.12</div><div class="desc">نسخة واحدة موحّدة. الكاش جاهز، وبعد الاختيار يكمل المسار الموجود في المشروع.</div><div class="ready">✓ CACHE READY • OFFLINE</div><div class="choice"><div class="row"><span class="muted">Firmware</span><b>9.00 – 9.60</b></div><div class="row"><span class="muted">GoldHEN</span><b>v2.4b18.12</b></div><div class="row"><span class="muted">Host</span><b>PSFree / Lapse</b></div></div><button class="go" onclick="selectVersion('v2.4b18.12')">🚀 &nbsp; START GOLDHEN &nbsp; ›</button></main><footer class="foot">AMINE PS4 • Simple / Fast / Offline</footer></div><script>
        function selectVersion(version) {
            // Store the selected version in localStorage
            localStorage.setItem('selectedGoldHENVersion', version);
            // Single GoldHEN v2.4b18.12 entry; keep the existing host path.
            window.location.href = 'cache.html';
        }

        // Gamepad navigation
        // Arrow keys are NOT intercepted: the PS4 browser moves its visible
        // focus pointer natively. Cards are activated with X (Enter/Space).
        var cards = document.querySelectorAll('.version-card');

        // Handle X (Enter/Space) on focused cards
        for (var cardIndex = 0; cardIndex < cards.length; cardIndex++) {
            var card = cards[cardIndex];
            card.addEventListener('keydown', function (event) {
                var cardKey = event.key || event.keyCode;
                if (cardKey === 'Enter' || cardKey === ' ' || cardKey === 13 || cardKey === 32) {
                    event.preventDefault();
                    this.click();
                }
            });
        }

        // Add click animation effect
        var animatedCards = document.querySelectorAll('.version-card');
        for (var animatedIndex = 0; animatedIndex < animatedCards.length; animatedIndex++) {
            var animatedCard = animatedCards[animatedIndex];
            animatedCard.addEventListener('mousedown', function () {
                this.style.transform = 'translateY(-2px) scale(0.98)';
            });

            animatedCard.addEventListener('mouseup', function () {
                this.style.transform = 'translateY(-5px) scale(1)';
            });

            animatedCard.addEventListener('mouseleave', function () {
                this.style.transform = 'translateY(0px) scale(1)';
            });

            animatedCard.addEventListener('blur', function () {
                this.style.transform = 'translateY(0px) scale(1)';
            });
        }
    </script></body></html>
