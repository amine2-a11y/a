<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
    <link rel="icon" type="image/png" href="../../pspulse.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMINE PS4 // 11.00-13.00 POOPS</title>
<style>
    :root {
        --bg: #151515;
        --panel: #1c1c1c;
        --panel-2: #242424;
        --line: #2e2e2e;
        --line-bright: #454545;
        --text: #f5f5f5;
        --muted: #b5b5b5;
        --dim: #828282;
        --accent: #a294ff;
        --red: #ff9b9b;
        --amber: #e1bd72;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    html, body { min-height: 100%; }
    body {
        background-color: var(--bg);
        background-image: linear-gradient(rgba(162, 148, 255, .05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(162, 148, 255, .05) 1px, transparent 1px);
        background-size: 36px 36px;
        color: var(--text);
        font: 16px/1.45 Consolas, "Liberation Mono", monospace;
        min-height: 100vh;
        overflow: hidden;
    }

    .app { margin: 0 auto; padding: 14px 26px 12px; width: min(100% - 52px, 1220px); }

    /* Top status bar */
    .bar {
        align-items: center;
        border: 1px solid var(--line-bright);
        display: flex;
        font-size: 14px;
        justify-content: space-between;
        letter-spacing: .1em;
        padding: 10px 16px;
        text-transform: uppercase;
    }
    .bar b { color: var(--accent); font-weight: 400; }
    .bar-chain { color: var(--dim); }
    .bar-chain::before { color: var(--accent); content: "\25CF "; }

    #state { color: var(--accent); font-size: 22px; font-weight: 400; line-height: 1.25; margin: 18px 0 10px; }
    .ok { color: var(--accent); }
    .bad { color: var(--red); }
    .warn { color: var(--amber); }

    /* chain JS scrolls this element - keep overflow and a fixed height */
    #out {
        background: var(--panel);
        border: 1px solid var(--line-bright);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        line-height: 1.45;
        height: calc(100vh - 150px);
        overflow-y: auto;
        padding: 12px 14px;
        white-space: pre-wrap;
    }

    @media (max-width: 760px) {
        .app { padding: 8px 10px; width: min(100% - 20px, 560px); }
        .bar { font-size: 12px; padding: 8px 12px; }
        #state { font-size: 19px; margin: 14px 0 8px; }
        #out { height: calc(100vh - 120px); font-size: 12px; }
    }
</style>
<script>
(function(){
  if (window.__amineMiniJB) return; window.__amineMiniJB=1;
  var KEY='amine-jb-ui-v4';
  var labels=['START','EXPLOIT','R/W','GOLDHEN','DONE'];
  var vals=[8,32,58,82,100];
  function state(){try{return sessionStorage.getItem(KEY)||''}catch(e){return ''}}
  function save(v){try{sessionStorage.setItem(KEY,v)}catch(e){}}
  function clear(){try{sessionStorage.removeItem(KEY)}catch(e){}}
  function ensure(){
    var b=document.getElementById('amine-mini-jb'); if(b)return b;
    var st=document.createElement('style'); st.id='amine-mini-jb-css';
    st.textContent='#amine-mini-jb{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);width:132px;z-index:2147483647;display:none;padding:5px 7px;border:1px solid rgba(40,190,255,.55);border-radius:6px;background:rgba(2,10,18,.94);box-shadow:0 0 10px rgba(0,160,255,.16);font:8px Arial,sans-serif;color:#dff7ff;text-align:left;pointer-events:none}#amine-mini-jb .r{display:flex;justify-content:space-between;align-items:center;gap:4px}#amine-mini-jb .name{font-weight:700;letter-spacing:.25px;white-space:nowrap}#amine-mini-jb .pct{font-weight:700;color:#43dcff}.amine-mini-bar{height:2px;margin-top:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}.amine-mini-fill{height:100%;width:0;background:#24c9ff;box-shadow:0 0 4px rgba(36,201,255,.55);transition:width .16s linear}.amine-mini-dots{display:flex;gap:2px;justify-content:center;margin-top:3px}.amine-mini-dots i{width:2px;height:2px;border-radius:50%;background:#3b5263}.amine-mini-dots i.on{background:#39d8ff;box-shadow:0 0 3px #39d8ff}#amine-mini-jb.ok{border-color:rgba(44,255,142,.65);box-shadow:0 0 10px rgba(44,255,142,.16)}#amine-mini-jb.ok .pct{color:#4dff9a}@media(max-width:700px){#amine-mini-jb{width:120px;bottom:40px;font-size:7px}}';
    document.head.appendChild(st);
    b=document.createElement('div'); b.id='amine-mini-jb';
    b.innerHTML='<div class="r"><span class="name">START</span><span class="pct">0%</span></div><div class="amine-mini-bar"><div class="amine-mini-fill"></div></div><div class="amine-mini-dots"><i class="on"></i><i></i><i></i><i></i><i></i></div>';
    document.body.appendChild(b); return b;
  }
  function paint(n,label){
    var b=ensure(); b.style.display='block'; b.className=n===4?'ok':'';
    var name=b.querySelector('.name'), pct=b.querySelector('.pct'), fill=b.querySelector('.amine-mini-fill'), dots=b.querySelectorAll('.amine-mini-dots i');
    name.textContent=label||labels[n]||'START'; pct.textContent=(vals[n]||0)+'%'; fill.style.width=(vals[n]||0)+'%';
    for(var i=0;i<dots.length;i++)dots[i].className=i<=n?'on':'';
    if(n===4) setTimeout(function(){b.style.display='none';clear();},2200);
  }
  function textScan(){
    var t=(document.body&&document.body.innerText||'').toLowerCase();
    if(/jailbreak success|goldhen.*loaded|goldhen.*load|payload-running|proof-ok/.test(t)){
      save('success'); paint(4,'✓ ACTIVATED'); return true;
    }
    if(/cannot load payload|failed to exploit|jailbreak failed|exploit failed/.test(t)){
      save('failed'); paint(0,'FAILED'); return true;
    }
    if(/loading jailbreak|please wait/.test(t)){paint(1,'EXPLOIT');return true;}
    if(/kernel read|kernel write|arbitrary read|arbitrary write|kernel exploit/.test(t)){paint(2,'R/W');return true;}
    return false;
  }
  window.amineJBStart=function(){save('running');paint(0,'START');setTimeout(function(){paint(1,'EXPLOIT')},350);setTimeout(function(){paint(2,'R/W')},1000);setTimeout(function(){paint(3,'GOLDHEN')},1800)};
  window.amineJBResult=function(ok){if(ok){save('success');paint(4,'✓ ACTIVATED')}else{save('failed');paint(0,'FAILED')}};
  window.addEventListener('load',function(){
    var b=ensure(), st=state();
    if(st==='running')paint(1,'EXPLOIT'); else if(st==='success')paint(4,'✓ ACTIVATED'); else b.style.display='none';
    setTimeout(textScan,300); setInterval(textScan,700);
    var log=document.getElementById('log');
    if(window.MutationObserver && log){new MutationObserver(textScan).observe(log,{subtree:true,childList:true,characterData:true});}
  });
})();
</script>
</head>
<body>
    <div class="app">
        <header class="bar">
            <span><b>AMINE PS4</b> // ps4 hosts</span>
            <span class="bar-chain">poops chain</span>
        </header>

        <div id="state">loading poops chain...</div>
        <div id="out"></div>
    </div>
<script type="module">import "./chain_poops.js";</script>
<script>
// AMINE PS4: bounded auto-reload when the primitive gives up.
// Repeated SSV placement misses mean this page-load heap layout does not
// suit the groom, and only a fresh load reshuffles it (PS4 WebKit exposes
// no GC). The chain reports ceiling exhaustion as "attempt-ceiling" in the
// visible log on both lapse and poops runners; on sight, reload up to 2
// times, then stop and leave FAILED visible for manual retry.
// The budget write must verifiably persist, otherwise a broken
// sessionStorage would loop forever -- fail closed instead.
// Upstream core.js / chain_*.js are NOT modified.
(function () {
    var KEY = "pspulse-slopkit-reloads";
    var MAX = 2;
    var WINDOW_MS = 10 * 60 * 1000;
    var handled = false;
    function readBudget() {
        var rec = null;
        try { rec = JSON.parse(sessionStorage.getItem(KEY) || "null"); } catch (e) { rec = null; }
        var now = Date.now();
        if (!rec || typeof rec.n !== "number" || (now - rec.t) > WINDOW_MS) return { n: 0, t: now };
        return rec;
    }
    function spendBudget() {
        var rec = readBudget();
        rec.n++;
        rec.t = Date.now();
        try {
            sessionStorage.setItem(KEY, JSON.stringify(rec));
            var check = JSON.parse(sessionStorage.getItem(KEY) || "null");
            if (check && check.n === rec.n) return rec;
        } catch (e) {}
        return null;
    }
    setInterval(function () {
        try {
            if (handled) return;
            var st = document.getElementById("state");
            if (st && st.className === "ok") {
                try { sessionStorage.removeItem(KEY); } catch (e) {}
                handled = true;
                return;
            }
            if (!st || st.textContent.indexOf("FAILED") === -1) return;
            var out = document.getElementById("out");
            var txt = out ? out.textContent : "";
            if (txt.indexOf("attempt-ceiling") === -1) return;
            handled = true;
            var rec = spendBudget();
            if (!rec || rec.n > MAX) return;
            st.textContent = "heap layout missed -- reloading for a fresh heap (" + rec.n + "/2)...";
            st.className = "warn";
            setTimeout(function () { location.reload(); }, 2000);
        } catch (e) { /* never break the exploit page */ }
    }, 3000);
})();
</script></body>
</html>
